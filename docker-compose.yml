services:
  n8n-automation:
    build: .
    image: n8n-custom:local
    container_name: n8n-automation
    restart: unless-stopped
    ports:
      - "127.0.0.1:5678:5678"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - GENERIC_TIMEZONE=Africa/Nairobi
      - TZ=Africa/Nairobi
      - N8N_SECURE_COOKIE=false
      - WEBHOOK_URL=https://${NGROK_DOMAIN}/
      - N8N_PROXY_HOPS=1
      - N8N_RESTRICT_FILE_ACCESS_TO=/data/workspace
      - NODES_EXCLUDE=[]
      - N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS=true
      # Shared folder where n8n and MT5 pass backtest requests and reports
      - MT5_QUEUE_DIR=/data/workspace/mt5_queue
      # --- AI Sandbox Settings ---
      - N8N_INSTANCE_AI_SANDBOX_ENABLED=true
      - N8N_INSTANCE_AI_SANDBOX_PROVIDER=n8n-sandbox
      - N8N_SANDBOX_SERVICE_URL=http://sandbox-api:8080
      - N8N_SANDBOX_SERVICE_API_KEY=${N8N_SANDBOX_SERVICE_API_KEY}
    volumes:
      - n8n_data:/home/node/.n8n
      - ./workspace:/data/workspace

  ngrok:
    image: ngrok/ngrok:latest
    container_name: ngrok
    restart: unless-stopped
    depends_on:
      - n8n-automation
    environment:
      - NGROK_AUTHTOKEN=${NGROK_AUTHTOKEN}
    command: http --url=${NGROK_DOMAIN} n8n-automation:5678
    ports:
      - "127.0.0.1:4040:4040"

  mt5:
    image: gmag11/metatrader5_vnc:latest
    container_name: mt5-forwardtest
    restart: unless-stopped
    ports:
      - "3000:3000"
      - "8001:8001"
    environment:
      - MT5_QUEUE_DIR=/data/workspace/mt5_queue
    volumes:
      - ./mt5_config:/config
      - ./workspace:/data/workspace

  mt5-history-bridge:
    image: gmag11/metatrader5_vnc:latest
    container_name: mt5-history-bridge
    restart: unless-stopped
    depends_on:
      - mt5
    entrypoint:
      ["python3", "-u", "/data/workspace/strategies/mt5_history_watcher.py"]
    environment:
      - MT5_QUEUE_DIR=/data/workspace/mt5_queue
      - MT5_PRICES_DIR=/data/workspace/data/prices
      - MT5_COMMON_FILES=/config/.wine/drive_c/users/abc/AppData/Roaming/MetaQuotes/Terminal/Common/Files
    volumes:
      - ./mt5_config:/config
      - ./workspace:/data/workspace

volumes:
  n8n_data:
    external: true
